    pt-br: Um remake pessoal e não oficial do jogo de GBA Drill Dozer, de 2005, da Game Freak, feito com Godot 4.8. Este projeto não tem vínculo nem aprovação da Nintendo ou da Game Freak. Todas as marcas e direitos autorais pertencem aos respectivos donos.
    es: Un remake personal y no oficial del juego de GBA Drill Dozer, de 2005, de Game Freak, hecho con Godot 4.8. Este proyecto no está afiliado ni respaldado por Nintendo ni por Game Freak. Todas las marcas y derechos de autor pertenecen a sus respectivos dueños.

