  language: TypeScript
  year: 2019
  kind: work
  description:
    en: Web front end of the RevGás ERP, kept up to date from Angular 9 to 21. Angular Material, maps with deck.gl, SSR and PWA, Storybook, Vitest and Playwright.
    pt-br: Frontend web do ERP da RevGás, mantido atualizado do Angular 9 ao 21. Angular Material, mapas com deck.gl, SSR e PWA, Storybook, Vitest e Playwright.
    es: Frontend web del ERP de RevGás, actualizado de Angular 9 a 21. Angular Material, mapas con deck.gl, SSR y PWA, Storybook, Vitest y Playwright.

- id: entrega
  order: 2
  name:
    en: RevGás for Couriers
    pt-br: RevGás para Entregadores
    es: RevGás para Repartidores
  language: Kotlin
  year: 2022
  kind: work
  description:
    en: Native Android app for delivery management. Kotlin, Jetpack Compose, Room, Koin and Firebase, with detekt, ktlint and a broad test suite.
    pt-br: App Android nativo para gestão de entregas. Kotlin, Jetpack Compose, Room, Koin e Firebase, com detekt, ktlint e uma suíte de testes ampla.
    es: App Android nativa para gestión de entregas. Kotlin, Jetpack Compose, Room, Koin y Firebase, con detekt, ktlint y una amplia suite de pruebas.

- id: revgas
  order: 3
  name:
    en: RevGás ERP · core
    pt-br: ERP RevGás · core
    es: ERP RevGás · core
  language: Java
  year: 2021
  kind: work
  description:
    en: Fiscal and management system for LPG resellers, a Java monolith with Struts, Spring and Hibernate on AWS, plus new Spring Boot, Go and serverless services. Integrations with WhatsApp API, Twilio and Zendesk.
    pt-br: Sistema fiscal e gerencial para revendas de GLP, um monolito Java com Struts, Spring e Hibernate na AWS, além de novos serviços em Spring Boot, Go e serverless. Integrações com WhatsApp API, Twilio e Zendesk.
    es: Sistema fiscal y de gestión para revendedores de GLP, un monolito Java con Struts, Spring e Hibernate en AWS, más nuevos servicios en Spring Boot, Go y serverless. Integraciones con WhatsApp API, Twilio y Zendesk.

- id: bina
  order: 4
  name: Bina RevGás
  language: Rust
  year: 2026
  kind: work
  description:
    en: Desktop caller ID client that reads the phone line through the serial port. A rewrite in Rust and Tauri 2 of the old Java 8 client.
    pt-br: Cliente desktop de identificação de chamadas (bina) que lê a linha telefônica pela porta serial. Reescrita em Rust e Tauri 2 do cliente antigo em Java 8.
    es: Cliente de escritorio de identificación de llamadas que lee la línea telefónica por el puerto serie. Reescritura en Rust y Tauri 2 del antiguo cliente en Java 8.

- id: cadiro-vault
  order: 5
  name: CadiroVault
  language: Ruby
  year: 2026
  kind: personal
  description:
    en: Path of Exile 2 trading companion in Rails 8.1. Syncs stash listings from the trade site, price-checks items, watches new drops in near real time and matches in-game buy offers to items. Invite-only, with passkeys and TOTP, Hotwire, Solid Queue and SQLite, deployed with Kamal.
    pt-br: Companheiro de trade de Path of Exile 2 em Rails 8.1. Sincroniza os anúncios do stash no site de trade, estima preços, acompanha drops novos quase em tempo real e casa ofertas de compra do chat com os itens. Só por convite, com passkeys e TOTP, Hotwire, Solid Queue e SQLite, com deploy via Kamal.
    es: Compañero de trade de Path of Exile 2 en Rails 8.1. Sincroniza los anuncios del stash en el sitio de trade, estima precios, sigue drops nuevos casi en tiempo real y empareja ofertas de compra del chat con los ítems. Solo por invitación, con passkeys y TOTP, Hotwire, Solid Queue y SQLite, con deploy vía Kamal.

- id: certz
  order: 6
  name: Certz
  language: Ruby
  year: 2026
  kind: personal
  description:
    en: Event certificate platform in Rails 8.1. Events, participants imported from spreadsheets and PDF certificates rendered with Grover. Pundit authorization, passkeys and TOTP. A rewrite of the original Zend Framework version.
    pt-br: Plataforma de certificados de eventos em Rails 8.1. Eventos, participantes importados de planilhas e certificados em PDF gerados com Grover. Autorização com Pundit, passkeys e TOTP. Reescrita da versão original em Zend Framework.
    es: Plataforma de certificados de eventos en Rails 8.1. Eventos, participantes importados de planillas y certificados en PDF generados con Grover. Autorización con Pundit, passkeys y TOTP. Reescritura de la versión original en Zend Framework.

- id: amazing-clash
  order: 7
  name: AMAZING//CLASH
  language: GDScript
  year: 2026
  kind: personal
  description:
    en: Real-time PvP arena game in Godot 4.8. Each player controls one fighter with aimed skillshots, in team or free-for-all matches. Deep builds inspired by Path of Exile 2 are drafted into a fixed loadout before each match. Server-authoritative networking, GUT tests and a Rails 8.1 backend.
    pt-br: Jogo de arena PvP em tempo real em Godot 4.8. Cada jogador controla um lutador com habilidades de mira (skillshots), em partidas por equipe ou todos contra todos. Builds profundas inspiradas em Path of Exile 2 viram um loadout fixo antes de cada partida. Rede com servidor autoritativo, testes em GUT e backend em Rails 8.1.
    es: Juego de arena PvP en tiempo real en Godot 4.8. Cada jugador controla un luchador con habilidades de apuntado (skillshots), en partidas por equipos o todos contra todos. Builds profundas inspiradas en Path of Exile 2 se fijan en un loadout antes de cada partida. Red con servidor autoritativo, pruebas en GUT y backend en Rails 8.1.

