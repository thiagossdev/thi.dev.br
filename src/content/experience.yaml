- id: revgas-analyst
  company: RevGás
  url: https://revgas.com
  location: Teresina, PI
  start: "2021-11"
  end: "2026-07"
  role:
    en: Systems Analyst
    pt-br: Analista de Sistemas
    es: Analista de Sistemas
  summary:
    en:
      - Fiscal and management system for LPG resellers, focused on operational efficiency and compliance.
      - Angular front end kept up to date from version 9 to 21, a native Android app in Kotlin and Jetpack Compose, and new Spring Boot, Go and serverless services next to the Java monolith.
      - Desktop caller ID client rewritten from Java 8 to Rust and Tauri 2.
      - Requirements gathering with stakeholders, testing, technical support and end-user training.
    pt-br:
      - Sistema fiscal e gerencial para revendas de GLP, com foco em eficiência operacional e conformidade.
      - Frontend em Angular atualizado da versão 9 à 21, app Android nativo em Kotlin e Jetpack Compose e novos serviços em Spring Boot, Go e serverless ao lado do monolito Java.
      - Cliente desktop de identificação de chamadas reescrito de Java 8 para Rust e Tauri 2.
      - Levantamento de requisitos com stakeholders, testes, suporte técnico e treinamento dos usuários finais.
    es:
      - Sistema fiscal y de gestión para revendedores de GLP, con foco en eficiencia operativa y cumplimiento.
      - Frontend en Angular actualizado de la versión 9 a la 21, app Android nativa en Kotlin y Jetpack Compose y nuevos servicios en Spring Boot, Go y serverless junto al monolito Java.
      - Cliente de escritorio de identificación de llamadas reescrito de Java 8 a Rust y Tauri 2.
      - Relevamiento de requisitos con stakeholders, pruebas, soporte técnico y capacitación de usuarios finales.
  stack: [Java, Spring Boot, Angular, Kotlin, Jetpack Compose, Python, Go, Rust, Tauri, AWS Lambda, AWS CDK, DynamoDB, MySQL]

