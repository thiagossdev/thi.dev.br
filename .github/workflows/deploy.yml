name: CI e deploy

# Pull requests (inclusive os do Dependabot) rodam só a checagem.
# Push na main roda a checagem, o build com os PDFs do currículo e publica no GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Node e pnpm nas versões do mise.toml
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - name: Build do site
        run: pnpm build
        env:
          # Opcional: token do Cloudflare Web Analytics (Settings > Secrets and variables > Variables)
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      # Chromium na versão fixada pelo Playwright do lockfile, com as bibliotecas do sistema.
      # Sem cache: a documentação do Playwright diz que restaurar custa quase o mesmo que baixar.
      - name: Chromium para os PDFs
        run: pnpm exec playwright install --with-deps --only-shell chromium
        timeout-minutes: 5
      - name: PDFs do currículo
        run: pnpm cv:pdf
        timeout-minutes: 5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
